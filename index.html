<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Layar informasi dan pengumuman Signage.">
  <title>Signage — Informasi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #f8fafc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 82% 18%, rgb(34 211 238 / 18%), transparent 34rem),
        radial-gradient(ellipse at 10% 92%, rgb(99 102 241 / 20%), transparent 38rem),
        #101827;
    }

    .screen {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(2rem, 6vw, 6rem);
    }

    header, footer, .meta { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }

    .brand { display: flex; align-items: center; gap: .85rem; font-size: 1.05rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .brand-mark { width: .8rem; height: .8rem; border-radius: 50%; background: #67e8f9; box-shadow: 0 0 1.5rem #22d3ee; }
    .clock { color: #cbd5e1; font-variant-numeric: tabular-nums; font-size: clamp(1rem, 1.8vw, 1.35rem); }

    main { width: min(100%, 74rem); margin: auto 0; padding: 5rem 0; }
    .eyebrow { margin: 0 0 1.25rem; color: #67e8f9; font-size: .9rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { max-width: 13ch; margin: 0; font-size: clamp(3.5rem, 10vw, 8.5rem); line-height: .98; letter-spacing: -.065em; }
    .intro { max-width: 40rem; margin: 2rem 0 0; color: #cbd5e1; font-size: clamp(1.1rem, 2.2vw, 1.6rem); line-height: 1.65; }

    .info-card { display: flex; align-items: center; gap: 1rem; width: fit-content; margin-top: 3rem; padding: 1rem 1.25rem; border: 1px solid rgb(148 163 184 / 22%); border-radius: 1rem; background: rgb(255 255 255 / 5%); color: #e2e8f0; }
    .info-icon { display: grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: .75rem; background: rgb(103 232 249 / 12%); color: #67e8f9; font-size: 1.25rem; }
    .info-card strong, .info-card span { display: block; }
    .info-card span { margin-top: .2rem; color: #94a3b8; font-size: .9rem; }

    footer { border-top: 1px solid rgb(148 163 184 / 20%); padding-top: 1.5rem; color: #94a3b8; font-size: .9rem; }
    .status { display: inline-flex; align-items: center; gap: .6rem; }
    .status-dot { width: .55rem; height: .55rem; border-radius: 50%; background: #4ade80; }

    @media (max-width: 600px) {
      .screen { padding: 1.5rem; }
      header { align-items: flex-start; flex-direction: column; gap: .75rem; }
      main { padding: 3rem 0; }
      footer { align-items: flex-start; flex-direction: column; gap: .75rem; }
      .info-card { margin-top: 2rem; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Signage</div>
      <time class="clock" id="clock" aria-label="Waktu saat ini"></time>
    </header>

    <main>
      <p class="eyebrow">Layar informasi</p>
      <h1>Selamat datang.</h1>
      <p class="intro">Informasi dan pengumuman terbaru akan ditampilkan di sini. Silakan nikmati waktu Anda.</p>
      <div class="info-card">
        <div class="info-icon" aria-hidden="true">✦</div>
        <div>
          <strong>Semoga hari Anda menyenangkan</strong>
          <span>Terima kasih telah berkunjung</span>
        </div>
      </div>
    </main>

    <footer>
      <div id="today"></div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span>Layar aktif</div>
    </footer>
  </div>

  <script>
    const clock = document.querySelector('#clock');
    const today = document.querySelector('#today');
    const timeFormatter = new Intl.DateTimeFormat('id-ID', {
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const dateFormatter = new Intl.DateTimeFormat('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    function updateDateTime() {
      const now = new Date();
      clock.textContent = timeFormatter.format(now);
      today.textContent = dateFormatter.format(now);
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>
</body>
</html>
